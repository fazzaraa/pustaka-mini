server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Docker DNS: nama service "backend" di-resolve lewat jaringan Compose
  resolver 127.0.0.11 valid=10s;

  # Permintaan API diteruskan ke service backend (bukan alamat IP laptop)
  location /api/ {
    set $backend http://backend:8000;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Vue Router (history mode): path lain diarahkan ke index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}